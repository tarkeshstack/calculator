<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths &amp; Stats Tools</title>
<meta name="description" content="Free online calculators for students: arithmetic, algebra, geometry, statistics, probability, regression, machine-learning models, critical path and finance maths.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--soft:#64748B;--bg:#FFFFFF;--line:#E7DEC8;--a:#0F766E;--ab:#CCFBF1}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
/* header */
.hhead{padding:34px 0 8px}
.hhead h1{font-size:clamp(30px,5.4vw,50px);font-weight:800;letter-spacing:-.01em}
.hhead .ruler{height:26px;margin:10px 0 8px;opacity:.6;border-radius:3px;border:1.2px solid rgba(146,64,14,.7);background:repeating-linear-gradient(90deg,rgba(146,64,14,.8) 0 1px,transparent 1px 8px) 0 0/100% 8px no-repeat,repeating-linear-gradient(90deg,rgba(146,64,14,.9) 0 1.2px,transparent 1.2px 40px) 0 0/100% 15px no-repeat,rgba(252,211,77,.18)}
.hhead p{margin:0 0 26px;color:var(--soft);font-size:15px}
.sbar{position:relative}
.sbar input{width:100%;padding:16px 20px;font:500 17px Inter,sans-serif;border-radius:16px;border:2px solid #E5D9BD;background:#fff;color:var(--ink);box-shadow:0 8px 24px rgba(31,42,68,.08)}
.sbar input::placeholder{color:#9aa3b2;opacity:1}.sbar input:focus{outline:0;border-color:var(--ink)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:thin;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%,transparent)}
.cat{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:600 13.5px Inter,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.cat i{font-style:normal;color:var(--soft);font-weight:500;margin-left:3px}
.cat:hover{border-color:var(--a,#1F2A44)}.cat.on{background:var(--a,#1F2A44);border-color:var(--a,#1F2A44);color:#fff}.cat.on i{color:#ffffffcc}
.count{margin:6px 0 4px;font-size:13px;color:var(--soft)}
.gh{font-size:21px;margin:26px 0 10px;color:var(--a)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{display:flex;gap:12px;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--a);border-radius:14px;padding:13px 14px;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,42,68,.12)}
.ti{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ab);display:flex;align-items:center;justify-content:center;font-size:24px}
.tb{display:flex;flex-direction:column;gap:2px;min-width:0}.tb b{font-size:15px;line-height:1.25}
.tb span{font-size:12.5px;color:var(--soft);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tb em{font-style:normal;font-size:11px;color:var(--a);font-weight:700;margin-top:2px}
.none{padding:40px 10px;text-align:center;color:var(--soft)}
.sfoot{margin-top:46px;padding:26px 0 40px;border-top:1.5px solid rgba(146,64,14,.25);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;color:var(--soft);font-size:13px}
.sfoot b{font:700 15px Fraunces,Georgia,serif;color:var(--ink)}
/* tool view */
#tool{padding:22px 0 50px}.tv{max-width:900px;margin:0 auto;padding:0 20px}
.crumb{font-size:13px;color:var(--soft);margin-bottom:10px}.crumb a{text-decoration:none;font-weight:600;color:var(--a)}.crumb a:hover{text-decoration:underline}
.th{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.th h1{font-size:clamp(26px,4.6vw,38px);color:var(--ink);line-height:1.1}.lead{margin:8px 0 18px;color:var(--soft);font-size:16px;line-height:1.5}
.tact{display:flex;gap:10px;align-items:center;flex:none;padding-top:4px}
.ib{border:0;background:none;color:var(--ink);cursor:pointer;padding:6px;border-radius:8px;display:flex}.ib:hover{background:var(--ab);color:var(--a)}
.qrs{width:34px;height:34px;padding:1px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:zoom-in}.qrs svg{width:100%;height:100%;display:block}.qrs:hover{transform:scale(1.08)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(31,42,68,.06)}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.fin .wide{grid-column:1/-1}
label{display:block;font:700 11.5px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#64748B;margin-bottom:5px}
input[type=number],input[type=text],select,textarea{width:100%;font:500 16px Inter,sans-serif;color:var(--ink);background:#fff;border:1.5px solid #D9CFB8;border-radius:12px;padding:10px 12px}
textarea{font:500 14px 'JetBrains Mono',monospace;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a)}
.stepper{display:flex;align-items:stretch;gap:6px}.stepper input{text-align:center;min-width:54px}
.stepper button{flex:none;width:42px;border:1.5px solid #D9CFB8;background:var(--ab);color:var(--a);border-radius:12px;font:700 20px Inter;cursor:pointer;touch-action:manipulation}
.stepper button:active{background:var(--a);color:#fff}
.out{margin-top:14px}
.vis{margin:0 0 12px;background:#fff;border:1px solid #E7DEC8;border-radius:14px;padding:6px 6px 2px}.mchart{width:100%;height:auto;display:block;max-height:340px}
.result{background:var(--ab);border-radius:14px;padding:14px 16px}.result big{display:block;font:700 clamp(21px,3.6vw,28px) Fraunces,Georgia,serif;color:var(--a);line-height:1.2}.result small{display:block;margin-top:6px;color:#475569;font-size:14px;line-height:1.45}
.result.err{background:#FEE2E2}.result.err big{font-size:18px;color:#991B1B}
.tblwrap{overflow-x:auto;margin-top:12px}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{background:var(--ab);color:var(--a);text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:8px 10px}.tbl td{padding:8px 10px;border-bottom:1px solid #EFE7D2}.tbl caption{text-align:left;font-weight:700;padding:6px 0}
.rhtml{margin-top:12px;font-size:14px;line-height:1.55}.rhtml code{font-family:'JetBrains Mono',monospace;background:#F3EDDC;padding:1px 5px;border-radius:5px}
.how2{margin-top:16px;background:#fff;border-left:5px solid var(--a);border-radius:12px;padding:13px 16px;font-size:14.5px;line-height:1.55}
.notes{margin:12px 0 0;padding-left:20px;color:#475569;font-size:14px;line-height:1.55}
.ex{margin-top:12px;background:#FFFBEB;border:1.5px dashed #F5C84C;border-radius:12px;padding:12px 15px;font-size:14px;line-height:1.55}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.pn a{text-decoration:none;font-weight:600;font-size:13.5px;padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}.pn a:hover{border-color:var(--a);color:var(--a)}
/* modals */
.shm{position:fixed;inset:0;background:rgba(10,8,5,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.shbox{position:relative;background:#fff;color:var(--ink);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
.shbox h3{font-size:21px;margin:0 28px 6px 0;text-align:left}.shbox p{margin:0 0 10px;font-size:13px;color:#475569;text-align:left}
.shx{position:absolute;top:10px;right:10px;border:0;background:#eef2f7;border-radius:50%;width:30px;height:30px;cursor:pointer}
.shqr{display:block;margin:0 auto 12px;width:132px;height:132px;padding:6px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;cursor:zoom-in}.shqr svg,.qrbig svg{width:100%;height:100%;display:block}
.shurl{display:flex;gap:6px;margin-bottom:12px}.shurl input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:9px;font:12px 'JetBrains Mono',monospace}
.shurl button,.shgrid a,.shgrid button{border:0;background:#1F2A44;color:#fff;border-radius:10px;padding:9px 12px;font:600 13px Inter;cursor:pointer;text-decoration:none;text-align:center}
.shgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shgrid a:hover,.shgrid button:hover,.shurl button:hover{background:#d97706}
.qrbig{width:min(78vw,320px);height:min(78vw,320px);margin:10px auto;padding:10px;background:#fff;border:1px solid #e2e8f0;border-radius:14px}
.qrlink{font:11px 'JetBrains Mono',monospace!important;word-break:break-all;color:#64748b!important;text-align:center!important}
.shnote{font-size:12px!important}

.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.backbtn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;color:var(--a);background:var(--ab);border-radius:99px;padding:8px 14px}.backbtn:hover{background:var(--a);color:#fff}
.tt{font-size:clamp(25px,4.6vw,36px);line-height:1.12;margin:0}
.reset{margin-top:12px;border:0;background:none;color:var(--soft);font:600 13px Inter,sans-serif;cursor:pointer;padding:4px 0}.reset:hover{color:var(--a)}
.more{margin-top:16px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px 14px}
.more summary{cursor:pointer;font-weight:700;font-size:14.5px;padding:12px 0;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
.more summary::after{content:'+';font-size:20px;line-height:1;color:var(--a)}.more[open] summary::after{content:'−'}.more summary::-webkit-details-marker{display:none}
.more .how2{margin:0 0 10px;box-shadow:none;background:var(--ab)}.more .ex{margin-bottom:12px}
.out{margin-top:10px}.out .result{margin-bottom:12px}.topline .tact{flex-direction:row!important;padding:0!important}.backbtn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scs{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;margin:26px auto 10px;max-width:760px}.scs .sc{width:104px}
.sc{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);padding:6px 2px;border-radius:14px}
.sc:hover{background:#fff}.sc:hover .si{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,42,68,.16)}
.si{width:58px;height:58px;border-radius:50%;background:var(--ab);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:27px;transition:transform .15s,box-shadow .15s}
.sl{font-size:12px;font-weight:600;text-align:center;line-height:1.25;max-width:84px}
.bt{text-align:center;font-size:12.5px;color:var(--soft);margin:22px 0 0}.bt a{color:var(--soft);font-weight:600}.bt a:hover{color:var(--ink)}
@media(max-width:700px){.scs{gap:16px 6px;margin-top:20px}.scs .sc{width:calc(25% - 5px)}.si{width:42px;height:42px;font-size:20px}.sl{font-size:11px}.scs{gap:12px 6px}}
@media(max-width:340px){.scs .sc{width:calc(33.3% - 5px)}}
@media(max-width:560px){.wrap,.tv{padding:0 14px}}
.ct{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
.ctile{display:flex;flex-direction:column;gap:3px;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-top:6px solid var(--a);border-radius:16px;padding:16px;transition:transform .15s,box-shadow .15s}
.ctile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,42,68,.12)}
.ce{font-size:34px;line-height:1.1}.ctile b{font:700 18px Fraunces,Georgia,serif;margin-top:4px}.cn{font-size:12.5px;font-weight:700;color:var(--a)}
.cx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:2}.cx a{font-size:12px;font-weight:600;text-decoration:none;color:var(--a);background:var(--ab);border-radius:99px;padding:4px 10px}.cx a:hover{background:var(--a);color:#fff}
.ctile{position:relative}.cmain{text-decoration:none;color:inherit}.cmain::after{content:'';position:absolute;inset:0;border-radius:16px;z-index:1}.cmain:focus-visible::after{outline:2px solid var(--a)}
.count{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}.back{font-weight:700;color:var(--ink);text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px}
.flat .tcard em{display:block}.gg:not(.flat) .tcard em{display:none}
@media(max-width:700px){
 body{font-size:15px}
 .hhead{padding:20px 0 4px}.hhead h1{font-size:30px}.hhead .ruler{height:20px;margin:8px 0 6px}.hhead p{font-size:13.5px;margin-bottom:14px}
 .sbar{position:sticky;top:0;z-index:30;padding:8px 0;background:var(--bg)}.sbar input{padding:13px 16px;font-size:16px;border-radius:14px;box-shadow:0 4px 14px rgba(31,42,68,.08)}
 .hhead{position:static}
 .ct{grid-template-columns:1fr 1fr;gap:10px}
 .ctile{padding:13px 12px}.ce{font-size:28px}.ctile b{font-size:15.5px;line-height:1.2}.cx{gap:5px}.cx a{font-size:11.5px;padding:3px 8px}
 .cats{top:62px;padding:8px 0 6px}
 .gg{grid-template-columns:1fr;gap:8px}
 .tcard{padding:10px 12px;gap:10px;border-left-width:4px;align-items:center}.ti{width:38px;height:38px;font-size:21px;border-radius:10px}
 .tb b{font-size:14.5px}.tb span{-webkit-line-clamp:1;font-size:12.5px}
 .count{font-size:13px}
 #tool{padding:12px 0 40px}.tt{font-size:24px}.lead{font-size:14.5px;margin:6px 0 12px}
 .th{flex-direction:row;align-items:flex-start}.th>div:first-child{min-width:0}.tact{flex-direction:column;gap:6px;align-items:center;padding-top:2px}
 .card{padding:12px;border-radius:14px}.fin{grid-template-columns:1fr 1fr;gap:10px}.fin .wide{grid-column:1/-1}
 input[type=number],input[type=text],select{font-size:16px;padding:10px}
 textarea{font-size:13px}
 .stepper button{width:38px}
 .result big{font-size:21px}.tbl{font-size:13px}.tbl th,.tbl td{padding:7px 8px}
 .how2,.ex{font-size:13.5px}
 .pn{flex-direction:column}.pn a{text-align:center}
 .sfoot{margin-top:28px}
}
@media(max-width:380px){.fin{grid-template-columns:1fr}.ct{gap:8px}}


@media(min-width:700px){#tool .tv{max-width:none;padding:0 28px}#tool{padding:20px 0 50px}.fin{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media(min-width:1000px){#tool .live{display:grid;grid-template-columns:minmax(320px,2fr) 3fr;grid-template-areas:'fin out' 'rst out';grid-template-rows:auto 1fr;gap:0 28px;align-items:start}#tool .live .fin{grid-area:fin;grid-template-columns:1fr 1fr}#tool .live .reset{grid-area:rst;justify-self:start;margin-top:10px}#tool .live .out{grid-area:out;margin-top:0}#tool .tt{font-size:34px}}
/* ===== scientific calculator (fx-991-style) ===== */
html,body{height:100%}body{background:#fff}
.app{min-height:100vh;min-height:100dvh;padding:10px;display:flex;justify-content:center}
.calc{position:relative;width:100%;max-width:520px;min-height:calc(100dvh - 20px);display:flex;flex-direction:column;padding:16px 16px 26px;border-radius:34px 34px 60px 60px/44px 44px 70px 70px;background:linear-gradient(180deg,#3d4770 0%,#2c3556 22%,#1f2641 70%,#181d34 100%);box-shadow:0 24px 50px rgba(20,24,50,.35),inset 0 0 0 2px #0f1224,inset 0 0 0 4px #4b5683,inset 0 -12px 22px rgba(0,0,0,.4);transition:max-width .25s}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 4px 12px}
.brandl{display:flex;align-items:center;gap:10px;min-width:0}.brandl .hi{height:30px;width:auto;color:#f2c14e;flex:none}
.brand b{display:block;font:italic 700 clamp(17px,4.6vw,24px)/1.1 Fraunces,Georgia,serif;color:#f4f6fb;letter-spacing:.01em}
.brand small{display:block;margin-top:4px;font:600 10.5px/1 Inter,sans-serif;color:#f2c14e;letter-spacing:.06em}
.solarbox{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.solar{display:block;width:clamp(96px,30vw,170px);height:30px;border-radius:5px;border:2px solid #05060b;background:repeating-linear-gradient(90deg,#1b1424 0 24%,#05060b 24% 25%),linear-gradient(#2b2236,#120d19);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.solarbox span{font:700 9.5px/1 Inter,sans-serif;color:#e8ebf5;letter-spacing:.14em}
.lcdwrap{background:#0f1224;border-radius:9px;padding:6px;margin:0 0 14px;box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.18)}
.lcd{position:relative;display:block;background:linear-gradient(180deg,#aab69d,#99a58c);border-radius:4px;padding:22px 12px 10px;min-height:84px;box-shadow:inset 0 3px 7px rgba(0,0,0,.35);color:#222b1c}
.lcd .st{position:absolute;left:12px;right:12px;top:6px;display:flex;justify-content:space-between;gap:10px;font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.65;white-space:nowrap}
.lcd .st span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:80%}
.lcd input{display:block;width:100%;margin:8px 0 0;padding:0;background:transparent;border:0;outline:0;font:700 clamp(17px,4.8vw,24px)/1.3 'JetBrains Mono',monospace;color:#222b1c;caret-color:#222b1c;-webkit-appearance:none;appearance:none}
.lcd input::placeholder{color:rgba(34,43,28,.45);opacity:1}.lcd input::-webkit-search-cancel-button{-webkit-appearance:none}
/* top row: popular tools as oval keys around a round pad */
.ctl{display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;gap:8px;margin:0 2px 16px}
.ov{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;min-width:0}
.ov small{font:700 8.5px/1 Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:#f2c14e}.ov:nth-child(even) small{color:#ff8fa3}
.ov i{display:flex;align-items:center;justify-content:center;width:100%;height:28px;border-radius:15px;font-style:normal;font-size:14px;background:linear-gradient(180deg,#e7e8ec,#b5b8c1);border:1px solid #0f1224;box-shadow:0 3px 0 #0b0e1c,inset 0 1px 0 #fff;transition:transform .08s,box-shadow .08s}
.ov:active i{transform:translateY(3px);box-shadow:0 0 0 #0b0e1c}
.rp{position:relative;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f3f4f7,#c4c7cf 70%,#a3a7b1);border:2px solid #0f1224;box-shadow:0 4px 0 #0b0e1c,inset 0 2px 0 #fff;align-self:center}
.rp button{position:absolute;border:0;background:transparent;color:#2b3150;font-size:12px;padding:6px;cursor:pointer;line-height:1}
.rp .u{top:2px;left:50%;transform:translateX(-50%)}.rp .d{bottom:2px;left:50%;transform:translateX(-50%)}.rp .l{left:2px;top:50%;transform:translateY(-50%)}.rp .r{right:2px;top:50%;transform:translateY(-50%)}
.rp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 8px/1 Inter,sans-serif;letter-spacing:.12em;color:#c9372a;pointer-events:none}
/* keypad */
.keys{display:grid;gap:12px 10px;padding:0}.keys.k3{grid-template-columns:repeat(3,1fr)}
.key{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;text-decoration:none;color:#fff;border-radius:11px;padding:8px 6px;min-height:76px;background:linear-gradient(180deg,#a3a7b0,#7c808b 60%,#6b6f7a);border:1px solid #101320;box-shadow:0 5px 0 #0b0e1c,0 7px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #0b0e1c,0 2px 3px rgba(0,0,0,.4)}
.key .ke{font-size:24px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.key .kl{font-size:12.5px;font-weight:700;line-height:1.2;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.keys.tk{grid-template-columns:repeat(3,1fr)}

    for(let q=0;q<s.length-1;q++){L[y[s[q]]]++;R[y[s[q]]]--;const a=X[s[q]][f],b=X[s[q+1]][f];if(b<=a)continue;

function kmeans(X,k,maxIt,seed){const r=M.rng(seed),n=X.length,d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
  const C=[X[Math.floor(r()*n)].slice()];
  while(C.length<k){const D=X.map(p=>Math.min(...C.map(c=>d2(p,c)))),s=M.sum(D);let i=0;if(s<=0)i=Math.floor(r()*n);else{let t=r()*s;for(;i<n-1&&(t-=D[i])>0;i++);}C.push(X[i].slice());}
  const a=new Array(n).fill(-1);let it=0,conv=false;
  for(;it<maxIt;it++){let ch=false;X.forEach((p,i)=>{let b=0,bd=Infinity;C.forEach((c,j)=>{const d=d2(p,c);if(d<bd){bd=d;b=j;}});if(a[i]!==b){a[i]=b;ch=true;}});
    if(!ch){conv=true;break;}
    for(let j=0;j<k;j++){const m=X.filter((_,i)=>a[i]===j);if(m.length)C[j]=[M.mean(m.map(p=>p[0])),M.mean(m.map(p=>p[1]))];}}
  let w=0;X.forEach((p,i)=>{if(a[i]>=0)w+=d2(p,C[a[i]]);});
  return {a,C,w,it,conv};}

  xs.forEach((x,i)=>{const p=cheb(2*x-1,d);for(let a=0;a<=d;a++){for(let c=0;c<=d;c++)A[a][c]+=p[a]*p[c];b[a]+=p[a]*ys[i];}});

 inputs:[{k:'s',l:'Starting value',t:'n',v:10000,s:500,min:0},{k:'e',l:'Ending value',t:'n',v:25000,s:500,min:0},{k:'y',l:'Years',t:'n',v:5,s:1,min:0.1,max:100}],

const npvAt=(f,r)=>f.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);
const irrOf=f=>{let lo=-0.99,pv=npvAt(f,lo);for(let h=-0.99+0.01;h<=10;h+=0.01){const nv=npvAt(f,h);if(isFinite(pv)&&isFinite(nv)&&pv*nv<=0){let a=h-0.01,b=h;for(let k=0;k<200;k++){const m=(a+b)/2;if(npvAt(f,a)*npvAt(f,m)<=0)b=m;else a=m;}return (a+b)/2;}pv=nv;}return null;};
MT.tools.push({id:'npvirr',book:'money',label:'NPV & IRR',icon:'⚖️',desc:'Value a series of cash flows today and find the rate that makes NPV zero.',kw:'npv irr net present value internal rate of return discount cash flow present value project',
 formula:'NPV = Σ CFₜ ÷ (1+r)^t, with t = 0 for today. IRR is the rate where NPV = 0 (found here by bisection).',
 notes:['Put the starting investment first as a negative number.','NPV > 0 means the project beats the discount rate.'],
 inputs:[{k:'f',l:'Cash flows, year 0 first (comma separated)',t:'list',v:'-1000, 300, 400, 500, 200'},{k:'r',l:'Discount rate (% per year)',t:'n',v:10,s:0.5,min:-50,max:200}],

  need(f.some(x=>x<0)&&f.some(x=>x>0),'You need at least one negative and one positive cash flow.');
  const r=v.r/100,npv=npvAt(f,r),irr=irrOf(f),hi=Math.max(30,irr===null?30:Math.ceil(irr*160/10)*10,v.r*1.5);

  const c=MT.chart({xmin:0,xmax:hi,ymin:ymin-pd,ymax:ymax+pd,xlabel:'Discount rate (%)',ylabel:'NPV',title:'NPV against discount rate',padL:58}).line(cv,C[0]).hline(0,'#64748b').dots([[v.r,npv]],C[1],5);
  if(irr!==null)c.vline(irr*100,C[4],'IRR '+fmt(irr*100,1)+'%');
  return {main:'NPV = '+fm(npv)+' · IRR = '+(irr===null?'none found':pc(irr*100)),sub:(npv>=0?'Worth doing':'Not worth doing')+' at a '+fmt(v.r)+'% discount rate. Red dot = your rate.',cols:['Year','Cash flow','Discount factor','Present value'],rows:f.slice(0,25).map((x,t)=>[t,x,fmt(1/Math.pow(1+r,t),4),x/Math.pow(1+r,t)]),svg:c.svg()};}});

MT.tools.push({id:'depreciation',book:'money',label:'Depreciation Calculator',icon:'📉',desc:'How an asset loses value each year, by straight-line or declining balance.',kw:'depreciation straight line declining balance book value salvage asset useful life',

MT.tools.push({id:'savingsgoal',book:'money',label:'Savings Goal Planner',icon:'🎯',desc:'How much to save each month, or how long it takes, to reach a target.',kw:'savings goal target monthly deposit how long to save plan sinking fund',
 formula:'Goal = start×(1+i)^n + P×((1+i)^n − 1)÷i, with i = annual rate ÷ 12. Solve for P (monthly amount) or step month by month to find n.',
 inputs:[{k:'m',l:'Find',t:'s',v:'Monthly amount needed',o:['Monthly amount needed','Time to reach goal']},{k:'g',l:'Goal amount',t:'n',v:100000,s:5000,min:1},{k:'c',l:'Already saved',t:'n',v:10000,s:1000,min:0},{k:'r',l:'Interest (% per year)',t:'n',v:6,s:0.5,min:0,max:50},{k:'y',l:'Years available (for "monthly amount")',t:'n',v:10,s:1,min:1,max:60},{k:'p',l:'Monthly saving (for "time to reach")',t:'n',v:500,s:50,min:0}],
 calc:v=>{need(v.g>v.c,'Your goal must be larger than what you have already saved.');const i=v.r/1200;let P,n,main,sub;
  if(v.m==='Monthly amount needed'){n=Math.round(v.y*12);const g=Math.pow(1+i,n);P=(v.g-v.c*g)/(i===0?n:(g-1)/i);need(P>0,'Your current savings will already reach the goal on their own. Raise the goal.');main='Save '+fm(P)+' per month';sub='for '+n+' months to reach '+fm(v.g)+' at '+fmt(v.r)+'% a year.';}

  return '<svg class="mchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title||'graph')+'">'+g+'</svg>';}

 inputs:[{k:'e',l:'Edges: from, to, weight',t:'text',v:'A, B, 4\nA, C, 2\nB, C, 1\nB, D, 5\nC, D, 8\nC, E, 10\nD, E, 2\nD, F, 6\nE, F, 3',r:8},{k:'a',l:'Start node',t:'text',v:'A',r:1},{k:'b',l:'End node',t:'text',v:'F',r:1},{k:'dir',l:'Edges are',t:'s',v:'Two-way (undirected)',o:['Two-way (undirected)','One-way (directed)']}],
 calc:v=>{const dir=v.dir[0]==='O',{nodes,edges}=parseEdges(v.e,dir),s=v.a.trim(),t=v.b.trim();if(nodes.indexOf(s)<0)throw new Error('Start node "'+s+'" is not in the edge list.');if(nodes.indexOf(t)<0)throw new Error('End node "'+t+'" is not in the edge list.');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

module.exports = QRRSBlock;

function buildCtl(){
  const pops=POP.map(p=>{const t=BY[p[0]];return '<a class="ov" href="#tool='+t.id+'" title="'+esc(t.label)+'"><small>'+esc(p[1])+'</small><i>'+(SI[t.id]||t.icon)+'</i></a>';});
  const rp='<div class="rp"><button class="u" data-n="u" aria-label="Scroll up">▲</button><button class="d" data-n="d" aria-label="Scroll down">▼</button><button class="l" data-n="l" aria-label="Previous page">◀</button><button class="r" data-n="r" aria-label="Next page">▶</button><b>NAV</b></div>';
  $('ctl').innerHTML=pops.slice(0,2).join('')+rp+pops.slice(2,4).join('');
  $('ctl').querySelector('.rp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.n;if(n==='u')scrollBy({top:-300,behavior:'smooth'});else if(n==='d')scrollBy({top:300,behavior:'smooth'});else if(n==='l')history.back();else history.forward();});
  $('pad').innerHTML='<a class="pk red" href="#saved">★ SAVED</a><a class="pk navy" href="#" id="backKey">◀ BACK</a><a class="pk red" href="#" id="acKey">AC</a>';
  $('acKey').onclick=e=>{e.preventDefault();query='';$('q').value='';if(location.hash&&location.hash!=='#')location.hash='';else showHome();};
  $('backKey').onclick=e=>{e.preventDefault();const h=location.hash,t=/tool=([a-z0-9]+)/.exec(h);if(t&&BY[t[1]])location.hash='#cat='+BY[t[1]].book;else if(h&&h!=='#')location.hash='';else if(query){query='';$('q').value='';showHome();}};
}
function crumb(t){$('crumb').textContent=t;}
function renderHome(){
  const q=query.trim();
  if(q){const r=list();
    $('grid').innerHTML=r.length?'<div class="keys k3 tk">'+r.map(t=>{const c=CAT[t.book];return keyOf('#tool='+t.id,SI[t.id]||t.icon,t.label,c.col,isBm(t.id)?'<span class="kstar">★</span>':'');}).join('')+'</div>':'<div class="none"><b>No calculator found.</b><br>Try a shorter word, for example “mean”, “interest”, “triangle” or “cluster”.</div>';
    crumb('SEARCH ▸ '+q);return;}
  $('grid').innerHTML='<div class="keys k3">'+CATS.map(c=>keyOf('#cat='+c.id,c.emoji,c.title,c.col)).join('')+'</div>';
  crumb('HOME ▸ PICK A TOPIC');
}
function list(){const tk=toks(query);return TOOLS.map(t=>[t,score(t,tk)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
$('q').addEventListener('input',()=>{query=$('q').value;if(!$('home').hidden)renderHome();else{if(location.hash&&location.hash!=='#')location.hash='';else showHome();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.closest('input,textarea,select')&&!$('home').hidden){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'){if(!$('shareModal').hidden||!$('qrModal').hidden){$('shareModal').hidden=true;$('qrModal').hidden=true;}else if(!$('tool').hidden&&cur)location.hash='#cat='+cur.book;else if(!$('catview').hidden)location.hash='';}});
/* ---------- category / saved keypad ---------- */
function showKeypad(title,emoji,col,tools,backHref,empty){
  const el=$('catview');el.style.setProperty('--a',col[0]);el.style.setProperty('--ab',col[1]);
  el.querySelector('.tv').innerHTML=    (tools.length?'<div class="keys k3 tk">'+tools.map(t=>{const c=CAT[t.book];return keyOf('#tool='+t.id,SI[t.id]||t.icon,t.label,c.col,isBm(t.id)?'<span class="kstar">★</span>':'');}).join('')+'</div>':'<p class="empty">'+empty+'</p>');
  crumb('HOME ▸ '+title.toUpperCase());
  $('home').hidden=true;$('tool').hidden=true;el.hidden=false;document.title=title+' · Maths & Stats Tools';window.scrollTo(0,0);
}
/* ---------- QR + share ---------- */
const base=()=>location.href.split('#')[0];
const linkFor=t=>base()+'#tool='+t.id;
function qrSvg(text){const q=new QRLib.QRCode(-1,QRLib.L.M);q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+2)+' '+(r+2)+'h1v1h-1z';return '<svg viewBox="0 0 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';}
const localNote=()=>location.protocol==='file:'?'This copy is a local file, so the link and code only work on this device. Put the file on a website and they work for everyone.':'';
let cur=null;
function shRefresh(){const t=cur,url=linkFor(t),txt='Try the "'+t.label+'" calculator on Maths & Stats Tools',u=encodeURIComponent(url),x=encodeURIComponent(txt);
  $('shUrl').value=url;$('shQr').innerHTML=qrSvg(url);
  $('shWa').href='https://wa.me/?text='+x+'%20'+u;$('shTg').href='https://t.me/share/url?url='+u+'&text='+x;$('shX').href='https://twitter.com/intent/tweet?text='+x+'&url='+u;$('shLi').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;$('shMail').href='mailto:?subject='+encodeURIComponent(t.label+' · Maths & Stats Tools')+'&body='+x+'%0A'+u;
  $('shNote').textContent=localNote();$('shNative').hidden=!navigator.share;}
function openShare(){$('shTitle').textContent='Share '+cur.icon+' '+cur.label;shRefresh();$('shareModal').hidden=false;}
function openQr(url){$('qrTitle').textContent=cur.icon+' '+cur.label;$('qrBig').innerHTML=qrSvg(url||linkFor(cur));$('qrLink').textContent=url||linkFor(cur);$('qrNote').textContent=localNote()||'Point a phone camera at the code to open this calculator.';$('qrModal').hidden=false;}
$('shClose').onclick=()=>$('shareModal').hidden=true;$('qrClose').onclick=()=>$('qrModal').hidden=true;
[$('shareModal'),$('qrModal')].forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.hidden=true;}));
$('shCopy').onclick=async()=>{const v=$('shUrl').value;try{await navigator.clipboard.writeText(v);}catch(e){$('shUrl').select();document.execCommand('copy');}$('shCopy').textContent='Copied ✓';setTimeout(()=>$('shCopy').textContent='Copy link',1800);};
$('shNative').onclick=()=>navigator.share({title:cur.label,text:'Maths & Stats Tools: '+cur.label,url:$('shUrl').value}).catch(()=>{});
$('shQr').addEventListener('click',()=>openQr($('shUrl').value));
/* ---------- tool view ---------- */
function readVals(t,els){const v={},M=MT.m;t.inputs.forEach(i=>{const e=els[i.k];
  if(i.t==='n'){let x=parseFloat(e.value);if(isNaN(x))x=0;if(i.min!==undefined&&x<i.min)x=i.min;if(i.max!==undefined&&x>i.max)x=i.max;v[i.k]=x;}
  else if(i.t==='s')v[i.k]=e.value;else if(i.t==='list')v[i.k]=M.parseList(e.value);else if(i.t==='pairs')v[i.k]=M.parsePairs(e.value);else if(i.t==='matrix')v[i.k]=M.parseMatrix(e.value);else v[i.k]=e.value;});return v;}
function showTool(t){
  cur=t;$('calc').classList.add('toolmode');const c=CAT[t.book];crumb('HOME ▸ '+c.title.toUpperCase()+' ▸ '+t.label.toUpperCase());
  const el=$('tool');el.style.setProperty('--a','#4B5563');el.style.setProperty('--ab','#EEF0F3');
  let r0;try{r0=t.calc(MT.defaults(t));}catch(e){r0={main:'—',sub:''};}
  const short=s=>{s=String(s).replace(/\s+/g,' ');return s.length>46?s.slice(0,44)+'…':s;};
  el.querySelector('.tv').innerHTML=
   '<div class="topline"><a class="backbtn" href="#cat='+t.book+'">← '+c.emoji+' '+esc(c.title)+'</a><div class="tact"><button type="button" id="tBm" class="ib bmb" aria-label="Bookmark" title="Bookmark"></button><button type="button" id="tShare" class="ib" aria-label="Share this calculator" title="Share"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.7l7.4-4.3M8.3 13.3l7.4 4.3"/></svg></button><button type="button" id="tQr" class="qrs" aria-label="Show QR code" title="QR code">'+qrSvg(linkFor(t))+'</button></div></div>'+
   '<h1 class="tt">'+t.icon+' '+esc(t.label)+'</h1><p class="lead">'+esc(t.desc)+'</p>'+
   '<div class="card live"><div class="fin"></div><button type="button" class="reset" id="tReset">↺ Reset to example</button><div class="out"></div></div>'+
   '<details class="more"><summary>How it works, example and tips</summary><div class="how2"><b>The rule.</b> '+esc(t.formula||'')+'</div>'+
   (t.notes&&t.notes.length?'<ul class="notes">'+t.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+
   '<div class="ex"><b>Worked example.</b> With '+t.inputs.map(i=>esc(i.l||i.k)+' = '+esc(short(i.v))).join(', ')+' the answer is <b>'+esc(r0.main)+'</b>.'+(r0.sub?' '+esc(r0.sub):'')+'</div></details>';
  const live=el.querySelector('.live'),box=live.querySelector('.fin'),out=live.querySelector('.out'),els={};
  t.inputs.forEach(i=>{const d=document.createElement('div');if(['list','pairs','matrix','text'].includes(i.t)&&(i.t!=='text'||(i.r||1)>1||String(i.v).length>40))d.className='wide';
    let h='<label>'+esc(i.l||i.k)+'</label>';
    if(i.t==='n')h+='<input type="number" value="'+i.v+'">';
    else if(i.t==='s')h+='<select>'+i.o.map(o=>'<option'+(o===i.v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    else if(i.t==='text'&&(i.r||1)<=1&&String(i.v).length<=40)h+='<input type="text" value="'+esc(i.v)+'" spellcheck="false">';
    else h+='<textarea rows="'+(i.r||(i.t==='list'?2:4))+'" spellcheck="false">'+esc(i.v)+'</textarea>';
    d.innerHTML=h;box.appendChild(d);els[i.k]=d.querySelector('input,select,textarea');});
  const go=()=>{try{out.innerHTML=MT.render(t.calc(readVals(t,els)));}catch(err){out.innerHTML='<div class="result err"><big>Check your input</big><small>'+esc(err.message||err)+'</small></div>';}};
  t.inputs.forEach(i=>{const e=els[i.k];e.addEventListener(i.t==='s'?'change':'input',go);if(i.t==='n')MT.stepify(e,i.s||1,i.min,i.max);});
  go();
  $('tReset').onclick=()=>{t.inputs.forEach(i=>{els[i.k].value=i.v;});go();};
  const bmb=$('tBm'),paint=()=>{const on=isBm(t.id);bmb.textContent=on?'★':'☆';bmb.classList.toggle('on',on);bmb.setAttribute('aria-pressed',on);};paint();
  bmb.onclick=()=>{const on=toggleBm(t.id);paint();toast(on?'Bookmarked ★ — find it on the home page':'Bookmark removed');};
  store.set(LASTK,t.id);
  $('tShare').onclick=openShare;$('tQr').onclick=()=>openQr();
  document.title=t.label+' · Maths & Stats Tools';
  $('home').hidden=true;$('catview').hidden=true;el.hidden=false;window.scrollTo(0,0);
}
function showHome(){cur=null;$('tool').hidden=true;$('catview').hidden=true;$('home').hidden=false;document.title='Maths & Stats Tools';renderHome();}
function route(){
  const h=location.hash,m=/tool=([a-z0-9]+)/.exec(h),c=/cat=([a-z]+)/.exec(h);
  $('calc').classList.remove('toolmode');cur=null;if(m||c||h==='#saved'){query='';$('q').value='';}
  if(m&&BY[m[1]]){showTool(BY[m[1]]);return;}
  if(c&&CAT[c[1]]){const k=CAT[c[1]];showKeypad(k.title,k.emoji,k.col,TOOLS.filter(t=>t.book===k.id),'#');return;}
  if(h==='#saved'){showKeypad('Saved','⭐',['#B45309','#FEF3C7'],bm().map(id=>BY[id]),'#','No bookmarks yet.<br>Open any tool and tap the ☆ at the top to keep it here.');return;}
  showHome();
}
addEventListener('hashchange',route);
buildCtl();route();
window.__tools={BY,TOOLS,showTool,route};
})();
</script>
